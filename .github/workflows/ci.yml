name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile every package
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Verify build output exists for every package
        run: |
          set -euo pipefail
          for pkg in protocol postgres evidence scenario runner oracle core shrinker report cli; do
            test -f "packages/$pkg/dist/index.js" || { echo "missing dist for $pkg"; exit 1; }
          done
          echo "all packages emitted dist/index.js"

      - name: CLI entry point loads
        run: node packages/cli/dist/index.js --version

  integration:
    name: Integration (real PostgreSQL 17 + real apps)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Confirm Docker engine is available
        run: |
          set -euo pipefail
          docker version
          docker info --format '{{.ServerVersion}}'

      - name: Pull PostgreSQL 17 image
        run: docker pull postgres:17

      - name: Doctor
        run: node packages/cli/dist/index.js doctor

      - name: Integration tests
        run: npm run test:integration

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rollprobe-integration-evidence
          path: .rollprobe/
          if-no-files-found: warn
          retention-days: 14
